name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (mock server only; no network, no GPU, no weights)
        run: pytest --cov --cov-report=term-missing

  mock-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: End-to-end MOCK run
        run: refusalscope mock-demo --out "$RUNNER_TEMP/mock-demo" --limit 20
      - name: Report generator must refuse an empty results directory
        run: |
          mkdir -p "$RUNNER_TEMP/empty-results"
          if python scripts/make_report.py --results "$RUNNER_TEMP/empty-results" --out "$RUNNER_TEMP/report-empty"; then
            echo "make_report.py rendered with no results at all" >&2
            exit 1
          fi
      - name: Report generator renders the committed real results
        run: python scripts/make_report.py --results results --out "$RUNNER_TEMP/report"
