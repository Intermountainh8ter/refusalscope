[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refusalscope"
version = "0.1.0"
description = "Research harness: does removing the refusal direction (abliteration) damage structured tool calling or raise indirect prompt-injection compliance?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ammon Jackson" }]
keywords = ["llm", "abliteration", "tool-calling", "prompt-injection", "evaluation", "safety", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Intermountainh8ter/refusalscope"
Source = "https://github.com/Intermountainh8ter/refusalscope"
Issues = "https://github.com/Intermountainh8ter/refusalscope/issues"
Changelog = "https://github.com/Intermountainh8ter/refusalscope/blob/main/CHANGELOG.md"

[project.scripts]
refusalscope = "refusalscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["refusalscope"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = false
fail_under = 90
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
# explicit so results do not drift with the installed ruff version's defaults
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PERF", "RUF"]
ignore = ["B905"]  # zip(strict=) is deliberately not required; lengths are checked explicitly
